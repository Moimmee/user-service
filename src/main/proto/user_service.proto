syntax = "proto3";

package user;

option java_package = "com.moimmee.proto.user";
option java_outer_classname = "UserServiceProto";

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

// 요청/응답 메시지

service UserService {
  rpc Register(RegisterReq) returns (google.protobuf.Empty);
  rpc GetUser(GetUserReq) returns (GetUserRes);
  rpc GetAllUsers(google.protobuf.Empty) returns (GetAllUsersRes);
}

message RegisterReq {
  string name = 1;
  string gender = 2;
  string email = 3;
}

message GetUserReq {
  int64 id = 1;
}

message GetUserRes {
  string name = 1;
  string role = 2;
  string gender = 3;
  string email = 4;
}

message GetAllUsersRes {
  repeated GetUserRes user = 1;
}