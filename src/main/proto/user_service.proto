syntax = "proto3";

package user;

option java_package = "com.moimmee.proto.user";
option java_outer_classname = "UserServiceProto";

import "google/protobuf/any.proto";

// 요청/응답 메시지
message BaseEntity {
  string created_date = 1;
  string updated_date = 2;
  google.protobuf.Any entity = 3;
}

// User 엔티티
message User {
  int64 id = 1;
  string name = 2;
  string role = 3;
  string gender = 4;
  string email = 5;
}